<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>SkyBound Airways — First Class to Anywhere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #050505;
        transition: opacity 0.8s ease;
        pointer-events: none;
      }
      #splash.done { opacity: 0; }
      #splash .inner { text-align: center; }
      #splash .sym {
        font-size: 28px; color: #eed9bc; margin-bottom: 20px;
        animation: sp 1.6s ease-in-out infinite;
        display: block;
      }
      @keyframes sp { 0%,100%{opacity:1;transform:translateY(0)} 50%{opacity:0.25;transform:translateY(-6px)} }
      #splash .brand {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 28px; letter-spacing: 0.35em; color: #fcfcfc;
      }
      #splash .tagline {
        font-family: 'Inter', sans-serif;
        font-size: 10px; letter-spacing: 0.3em; color: #eed9bc88;
        text-transform: uppercase; margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="inner">
        <span class="sym">✈</span>
        <div class="brand">SKYBOUND</div>
        <div class="tagline">Airways</div>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Veena World — Travel. Explore. Celebrate Life.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #050505;
        transition: opacity 0.8s ease;
        pointer-events: none;
      }
      #splash.done { opacity: 0; }
      #splash .inner { text-align: center; }
      #splash .sym {
        width: 120px; height: auto; margin-bottom: 16px; display: block; margin-left: auto; margin-right: auto;
      }
      #splash .brand {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 20px; letter-spacing: 0.25em; color: #fcfcfc;
      }
      #splash .tagline {
        font-family: 'Inter', sans-serif;
        font-size: 10px; letter-spacing: 0.3em; color: #FFD801;
        text-transform: uppercase; margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="inner">
        <img class="sym" src="/veena-world-logo.svg" alt="Veena World" />
        <div class="brand">VEENA WORLD</div>
        <div class="tagline">Travel. Explore. Celebrate Life.</div>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
